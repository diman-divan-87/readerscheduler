stages:
  - Build Dev
  - Deploy Dev
  - Build RC
  - Deploy RC
  - Merge to Release
  - Build Stage
  - Deploy Stage
  - Build Prod
  - Deploy Prod
  - Notify

.deploy_job_template: &deploy_job
  script:
    - cd .cicd
    - ansible-galaxy install -f -r ./requirements.yml
    - ansible-playbook playbook.yml -i "./inventories/${DEPLOY_STAGE}/hosts" --extra-vars "version=$CI_COMMIT_SHA"
  tags:
    - shell

.teams_notify_template: &teams_notify
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - chmod +x scripts/teams-notify.sh
    - sh scripts/teams-notify.sh "${STATUS}" "${JOB_NAME}" "${DEPLOY_ENV}"
  tags:
    - docker
  allow_failure: true

# Дев-сборка из любой feature ветки
Build-Dev-App:
  stage: Build Dev
  image: node:20.19.3
  script:
    - npm install --progress=false
    - npm run build:dev
  artifacts:
    paths:
      - build
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^feature\//
  tags:
    - docker

Deploy to Dev:
  stage: Deploy Dev
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^feature\//
  variables:
    DEPLOY_STAGE: "dev"
  <<: *deploy_job


Build-RC-App:
  stage: Build RC
  image: node:20.19.3
  script:
    - rm -rf build
    - npm install --progress=false
    - npm run build:rc
  artifacts:
    paths:
      - build
  rules:
    - if: $CI_COMMIT_BRANCH == "RC-release"
  tags:
    - docker

Deploy to RC:
  stage: Deploy RC
  variables:
    DEPLOY_STAGE: "rc"
  rules:
    - if: $CI_COMMIT_BRANCH == "RC-release"
  when: on_success
  <<: *deploy_job

# Merge RC → Release: создаёт MR из RC-release в release (squash при мерже)
Merge-RC-to-Release:
  stage: Merge to Release
  image:
    name: alpine/git:2.43.0
    entrypoint: [""]
  needs:
    - job: Deploy to RC
  variables:
    GIT_STRATEGY: none
  script:
    - rm -rf /tmp/repo
    - git clone "https://gitlab-ci-token:${GITLAB_MERGE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" /tmp/repo
    - cd /tmp/repo
    - git config user.email "ci-merge@local"
    - git config user.name "CI Merge Bot"
    - git fetch origin refs/heads/release:refs/remotes/origin/release refs/heads/RC-release:refs/remotes/origin/RC-release
    - |
      if git diff --quiet origin/release...origin/RC-release; then
        echo "В RC-release нет новых изменений относительно release, сливать нечего"
        exit 0
      fi
    - CHANGES=$(git log --pretty='- %s (%h)' origin/release..origin/RC-release)
    - git checkout -B rc-to-release-$CI_PIPELINE_IID origin/RC-release
    - |
      git push \
        -o merge_request.create \
        -o merge_request.target=release \
        -o merge_request.remove_source_branch \
        -o "merge_request.title=chore(release): RC → release [pipeline !${CI_PIPELINE_IID}]" \
        -o "merge_request.description=Автоматический MR из RC-release в release.%0A%0A**Источник:** ${CI_COMMIT_SHORT_SHA}%0A**Запустил:** ${GITLAB_USER_NAME:-CI} (@${GITLAB_USER_LOGIN:-ci})%0A**Pipeline:** ${CI_PIPELINE_URL}%0A%0A---%0A${CHANGES}" \
        origin rc-to-release-$CI_PIPELINE_IID

  rules:
    - if: $CI_COMMIT_BRANCH == "RC-release"
  when: manual
  tags:
    - docker

# Предрелизная сборка для показа (pre-release)
Build-Stage-App:
  stage: Build Stage
  image: node:20.19.3
  script:
    - npm install --progress=false
    - npm run build:dev
  artifacts:
    paths:
      - build
  rules:
    - if: $CI_COMMIT_BRANCH == "pre-release"
  tags:
    - docker

Deploy to Stage:
  stage: Deploy Stage
  rules:
    - if: $CI_COMMIT_BRANCH == "pre-release"
  variables:
    DEPLOY_STAGE: "test"
  <<: *deploy_job

# Релизная сборка
Build-Prod-App:
  stage: Build Prod
  image: node:20.19.3
  script:
    - rm -rf build
    - npm install --progress=false
    - npm run build
  artifacts:
    paths:
      - build
  rules:
    - if: $CI_COMMIT_BRANCH == "release"
  tags:
    - docker

Deploy to Prod:
  stage: Deploy Prod
  variables:
    DEPLOY_STAGE: "prod"
  rules:
    - if: $CI_COMMIT_BRANCH == "release"
  when: manual
  <<: *deploy_job

# ===== Уведомления Teams =====

Notify Deploy Dev Success:
  <<: *teams_notify
  stage: Notify
  variables:
    STATUS: "success"
    JOB_NAME: "Деплой DEV"
    DEPLOY_ENV: "dev"
  needs:
    - job: Deploy to Dev
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^feature\//
      when: on_success

Notify Deploy RC Success:
  <<: *teams_notify
  stage: Notify
  variables:
    STATUS: "success"
    JOB_NAME: "Деплой RC"
    DEPLOY_ENV: "rc"
  needs:
    - job: Deploy to RC
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == "RC-release"
      when: on_success

Notify Deploy Prod Success:
  <<: *teams_notify
  stage: Notify
  variables:
    STATUS: "success"
    JOB_NAME: "Деплой PROD"
    DEPLOY_ENV: "prod"
  needs:
    - job: Deploy to Prod
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == "release"
      when: on_success
